<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变色：清晨的青色到深邃的蓝色 -->
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f3f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1d8e0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00cec9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0984e3;stop-opacity:1" />
    </linearGradient>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. 日晷底盘（带有透视感的椭圆） -->
  <ellipse cx="100" cy="110" rx="80" ry="60" fill="url(#dialGrad)" stroke="#b2bec3" stroke-width="2" />
  
  <!-- 2. 刻度线（模拟日晷特有的放射状刻度） -->
  <g stroke="#7f8c8d" stroke-width="1.5" opacity="0.6">
    <line x1="100" y1="50" x2="100" y2="65" />
    <line x1="140" y1="65" x2="130" y2="75" />
    <line x1="170" y1="110" x2="155" y2="110" />
    <line x1="60" y1="65" x2="70" y2="75" />
    <line x1="30" y1="110" x2="45" y2="110" />
  </g>

  <!-- 3. 日晷指针（晷针 Gnomon）- 设计成一个现代感的几何体 -->
  <!-- 指针投影（影针），巧妙地形成一个对号的形状 -->
  <path d="M100 110 L125 135 L165 70" fill="none" stroke="#2d3436" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.1" />
  
  <!-- 真正的晷针（立体的立柱感） -->
  <path d="M100 110 L100 40" fill="none" stroke="url(#needleGrad)" stroke-width="8" stroke-linecap="round" filter="url(#shadow)" />
  
  <!-- 指针基座 -->
  <circle cx="100" cy="110" r="6" fill="#2d3436" />
</svg>
